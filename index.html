<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🩺 防止三高大作戰</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Sans:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EDF5F1;
  --teal: #1A7F6A;
  --teal-mid: #29A08A;
  --teal-light: #E0F2ED;
  --teal-pale: #F0FAF7;
  --green: #4A8F5A;
  --green-light: #EBF5EE;
  --text: #122820;
  --muted: #7A9A90;
  --card: #FFFFFF;
  --radius: 18px;
  --p1: #1A9080;
  --p1-light: #DFF4EF;
  --p2: #4A7FBF;
  --p2-light: #EAF1FB;
  --warn: #E07A40;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.confetti-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
.cp { position: absolute; top: -16px; opacity: 0; animation: fall linear forwards; border-radius: 2px; }
@keyframes fall { 0%{transform:translateY(0)rotate(0);opacity:1}100%{transform:translateY(105vh)rotate(540deg);opacity:0} }

.header { background: var(--teal); padding: 22px 20px 16px; text-align: center; }
.header-badge { display: inline-block; background: rgba(255,255,255,0.18); color: rgba(255,255,255,0.9); font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px; padding: 3px 12px; border-radius: 99px; margin-bottom: 8px; }
.header h1 { font-family: 'DM Sans', sans-serif; font-size: 1.6rem; font-weight: 900; color: white; letter-spacing: -0.5px; }
.header-sub { color: rgba(255,255,255,0.7); font-size: 0.78rem; margin-top: 5px; }

.tabs { display: flex; background: var(--card); border-bottom: 1px solid #E0EDE8; position: sticky; top: 0; z-index: 100; }
.tab { flex: 1; padding: 12px 4px; text-align: center; cursor: pointer; font-size: 0.78rem; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; transition: all 0.2s; }
.tab.active { color: var(--teal); border-bottom-color: var(--teal); }

.screen { display: none; padding: 18px; max-width: 600px; margin: 0 auto; }
.screen.active { display: block; }

.card { background: var(--card); border-radius: var(--radius); border: 1px solid #E0EDE8; padding: 18px; margin-bottom: 14px; }
.card-title { font-size: 0.92rem; font-weight: 900; margin-bottom: 14px; color: var(--text); display: flex; align-items: center; gap: 8px; }

.battle-banner { border-radius: var(--radius); background: linear-gradient(135deg, var(--p1-light) 0%, white 50%, var(--p2-light) 100%); border: 1px solid #D0EAE4; padding: 20px 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; position: relative; }
.versus-icon { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 1.4rem; background: white; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #DDD; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
.fighter { text-align: center; flex: 1; }
.fighter-name { font-weight: 900; font-size: 0.9rem; margin-bottom: 4px; }
.fighter-kg { font-family: 'DM Sans', sans-serif; font-size: 2rem; font-weight: 900; line-height: 1; }
.fighter.p1 .fighter-name, .fighter.p1 .fighter-kg { color: var(--p1); }
.fighter.p2 .fighter-name, .fighter.p2 .fighter-kg { color: var(--p2); }
.fighter-sub { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
.fighter-pct { font-size: 0.72rem; font-weight: 700; color: var(--teal); margin-top: 4px; }

.milestone-row { display: flex; gap: 6px; margin-top: 10px; }
.ms { flex: 1; text-align: center; padding: 6px 2px; border-radius: 10px; border: 1.5px solid #DDD; font-size: 0.6rem; color: var(--muted); font-weight: 700; background: white; transition: all 0.3s; }
.ms.reached { border-color: var(--teal); background: var(--teal-pale); color: var(--teal); }
.ms.p2-reached { border-color: var(--p2); background: var(--p2-light); color: var(--p2); }
.ms .ms-icon { font-size: 1.1rem; display: block; margin-bottom: 2px; }

.prog-wrap { margin-bottom: 12px; }
.prog-label { display: flex; justify-content: space-between; font-size: 0.78rem; font-weight: 700; margin-bottom: 5px; }
.prog-track { height: 10px; background: #E8F0EE; border-radius: 99px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 99px; transition: width 0.9s cubic-bezier(.4,2,.5,1); }
.prog-fill.p1 { background: linear-gradient(90deg, var(--teal-mid), var(--teal)); }
.prog-fill.p2 { background: linear-gradient(90deg, #7AAAE0, var(--p2)); }

.day-row { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.dd { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #DDD; display: flex; align-items: center; justify-content: center; font-size: 0.63rem; font-weight: 800; cursor: default; color: var(--muted); background: white; }
.dd.logged-both { background: var(--teal); border-color: var(--teal); color: white; }
.dd.logged-one { background: var(--teal-pale); border-color: var(--teal-mid); color: var(--teal); }
.dd.today { box-shadow: 0 0 0 3px var(--teal-mid); border-color: var(--teal); color: var(--teal); }
.dd.today.logged-both { background: var(--teal); color: white; }

.quote-box { background: var(--teal-pale); border-radius: var(--radius); border-left: 4px solid var(--teal); padding: 14px 16px; margin-bottom: 14px; position: relative; }
.quote-pet { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 2rem; }
.quote-text { font-size: 0.95rem; font-weight: 700; color: var(--teal); padding-right: 44px; line-height: 1.5; }
.quote-sub { font-size: 0.75rem; color: var(--muted); margin-top: 5px; }

.form-group { margin-bottom: 13px; }
label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
input, textarea, select { width: 100%; padding: 9px 13px; border: 1.5px solid #D8EAE4; border-radius: 11px; font-family: 'Noto Sans TC', sans-serif; font-size: 0.88rem; color: var(--text); background: #FAFCFB; outline: none; transition: border-color 0.2s; }
input:focus, textarea:focus, select:focus { border-color: var(--teal); background: white; }
textarea { resize: vertical; min-height: 60px; }
.meal-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.meal-cell { background: var(--bg); border-radius: 12px; padding: 10px; border: 1.5px solid #D8EAE4; }
.meal-cell label { font-size: 0.72rem; margin-bottom: 4px; }
.meal-cell textarea { background: transparent; border: none; padding: 2px 0; font-size: 0.82rem; min-height: 65px; }
.meal-cell textarea:focus { border: none; box-shadow: none; }

.btn { width: 100%; padding: 13px; border: none; border-radius: 12px; font-family: 'Noto Sans TC', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 6px; }
.btn-primary { background: var(--teal); color: white; }
.btn-primary:hover { background: var(--teal-mid); transform: translateY(-1px); }
.btn-green { background: var(--green); color: white; }
.btn-green:hover { background: #3A7A4A; }

.toggle { display: flex; background: var(--bg); border-radius: 12px; padding: 3px; margin-bottom: 14px; border: 1px solid #D8EAE4; }
.toggle-btn { flex: 1; padding: 8px; border: none; background: transparent; font-family: 'Noto Sans TC', sans-serif; font-size: 0.85rem; font-weight: 700; border-radius: 10px; cursor: pointer; color: var(--muted); transition: all 0.2s; }
.toggle-btn.on-p1 { background: var(--p1); color: white; }
.toggle-btn.on-p2 { background: var(--p2); color: white; }

.log-item { padding: 12px 14px; background: white; border-radius: 12px; margin-bottom: 10px; border: 1px solid #E0EDE8; border-left: 3px solid var(--p1); }
.log-item.p2 { border-left-color: var(--p2); }
.log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.log-day { font-weight: 800; font-size: 0.82rem; }
.log-kg { font-size: 0.75rem; padding: 2px 9px; border-radius: 99px; font-weight: 700; }
.log-item .log-kg { background: var(--p1-light); color: var(--p1); }
.log-item.p2 .log-kg { background: var(--p2-light); color: var(--p2); }
.log-row { font-size: 0.77rem; color: #777; margin-top: 3px; }
.log-row b { color: #555; font-weight: 700; }

.weigh-reminder { background: var(--teal-light); border-radius: 12px; border-left: 3px solid var(--teal); padding: 10px 14px; margin-bottom: 14px; font-size: 0.82rem; color: var(--teal); font-weight: 700; display: flex; align-items: center; gap: 8px; }

.setup-top { text-align: center; padding: 20px 0 16px; }
.setup-top h2 { font-family: 'DM Sans', sans-serif; font-size: 1.5rem; font-weight: 900; color: var(--teal); }
.setup-top p { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
.goal-tag { display: inline-block; background: var(--teal); color: white; font-weight: 900; padding: 6px 18px; border-radius: 99px; margin-top: 10px; font-size: 0.9rem; }
.p-setup { border-radius: var(--radius); padding: 15px; margin-bottom: 10px; }
.p-setup.s1 { background: var(--p1-light); }
.p-setup.s2 { background: var(--p2-light); }
.p-setup h3 { font-weight: 900; font-size: 0.92rem; margin-bottom: 12px; }
.p-setup.s1 h3 { color: var(--p1); }
.p-setup.s2 h3 { color: var(--p2); }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.stat { background: white; border-radius: 12px; padding: 10px 6px; text-align: center; border: 1px solid #E0EDE8; }
.stat .v { font-family: 'DM Sans', sans-serif; font-size: 1.3rem; font-weight: 900; }
.stat .l { font-size: 0.63rem; color: var(--muted); font-weight: 600; margin-top: 2px; }
.stat.c1 .v { color: var(--p1); }
.stat.c2 .v { color: var(--p2); }
.stat.cg .v { color: var(--teal); }

.milestone-popup { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) scale(0.8); background: white; border-radius: 20px; padding: 18px 28px; text-align: center; box-shadow: 0 12px 40px rgba(26,127,106,0.22); border: 2px solid var(--teal); z-index: 9998; opacity: 0; transition: all 0.4s cubic-bezier(.34,1.56,.64,1); pointer-events: none; min-width: 220px; }
.milestone-popup.show { opacity: 1; transform: translateX(-50%) scale(1); }
.mp-icon { font-size: 2.5rem; display: block; margin-bottom: 6px; }
.mp-title { font-family: 'DM Sans', sans-serif; font-size: 1.1rem; font-weight: 900; color: var(--teal); }
.mp-sub { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px); background: rgba(20,50,40,0.9); color: white; padding: 10px 22px; border-radius: 99px; font-size: 0.85rem; font-weight: 700; z-index: 9999; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty-icon { font-size: 2.8rem; display: block; margin-bottom: 10px; }

.sync-bar { display: flex; align-items: center; justify-content: space-between; background: var(--teal-light); border-radius: 12px; border: 1px solid #B8DDD5; padding: 9px 14px; margin-bottom: 14px; font-size: 0.78rem; }
.sync-status { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--teal); }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); flex-shrink:0; }
.sync-dot.syncing { background: var(--warn); animation: pulse 1s ease-in-out infinite; }
.sync-dot.error { background: #D04040; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.sync-btn { background: var(--teal); color: white; border: none; border-radius: 8px; padding: 4px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; }
.sync-btn:hover { background: var(--teal-mid); }

.info-chip { display: inline-block; background: var(--teal-light); color: var(--teal); font-size: 0.72rem; font-weight: 700; border-radius: 99px; padding: 3px 10px; margin: 3px 3px 3px 0; border: 1px solid #B8DDD5; }

@media(max-width:400px){ .meal-grid{grid-template-columns:1fr} .stat-grid{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>

<div class="confetti-wrap" id="confettiWrap"></div>
<div class="toast" id="toast"></div>
<div class="milestone-popup" id="msPopup">
  <span class="mp-icon" id="mpIcon">🐾</span>
  <div class="mp-title" id="mpTitle">里程碑達成！</div>
  <div class="mp-sub" id="mpSub">繼續加油！</div>
</div>

<div class="header">
  <div class="header-badge">第一階段健康計畫</div>
  <h1>🩺 防止三高大作戰</h1>
  <div class="header-sub">目標：減輕體重的 10%，降低高血壓・高血糖・高血脂風險</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="go('dashboard')">🏠 戰況</div>
  <div class="tab" onclick="go('log')">📝 記錄</div>
  <div class="tab" onclick="go('history')">📖 日誌</div>
  <div class="tab" onclick="go('setup')">⚙️ 設定</div>
</div>

<div class="screen active" id="screen-dashboard"><div id="db"></div></div>

<div class="screen" id="screen-log">
  <div class="toggle">
    <button class="toggle-btn on-p1" id="lb1" onclick="setLP(1)">🐾 <span id="ln1">我</span></button>
    <button class="toggle-btn" id="lb2" onclick="setLP(2)">🐶 <span id="ln2">妹妹</span></button>
  </div>
  <div class="weigh-reminder" id="weighReminder">⏰ 記得在固定時間量體重唷！</div>
  <div class="card">
    <div class="card-title">📅 填寫日期與體重</div>
    <div class="form-group"><label>選擇日期</label><input type="date" id="lDate" onchange="refreshLog()"></div>
    <div id="logDayBadge" style="margin:-6px 0 12px;font-size:0.8rem;color:var(--muted);font-weight:700;"></div>
    <div class="form-group"><label>⚖️ 今天體重 (kg)</label><input type="number" id="lWt" step="0.1" placeholder="例：57.3"></div>
  </div>
  <div class="card">
    <div class="card-title">🍽️ 三餐內容</div>
    <div class="meal-grid">
      <div class="meal-cell"><label>🌅 早餐</label><textarea id="lBF" placeholder="吃了什麼…"></textarea></div>
      <div class="meal-cell"><label>☀️ 午餐</label><textarea id="lL" placeholder="吃了什麼…"></textarea></div>
      <div class="meal-cell"><label>🌙 晚餐</label><textarea id="lD" placeholder="吃了什麼…"></textarea></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">🏃 運動 & 心情</div>
    <div class="form-group"><label>今天的運動</label><textarea id="lEx" placeholder="走路30分鐘？瑜伽？騎腳踏車？"></textarea></div>
    <div class="form-group"><label>💬 今日備註</label><textarea id="lNote" placeholder="今天狀態如何？有什麼感覺？🐶" style="min-height:55px"></textarea></div>
  </div>
  <button class="btn btn-primary" onclick="saveLog()">💪 儲存今日紀錄</button>
</div>

<div class="screen" id="screen-history">
  <div class="toggle">
    <button class="toggle-btn on-p1" id="hb1" onclick="setHP(1)">🐾 <span id="hn1">我</span></button>
    <button class="toggle-btn" id="hb2" onclick="setHP(2)">🐶 <span id="hn2">妹妹</span></button>
  </div>
  <div id="hist"></div>
</div>

<div class="screen" id="screen-setup">
  <div class="setup-top">
    <div style="font-size:2.5rem;margin-bottom:8px">🐾🩺🐶</div>
    <h2>挑戰設定</h2>
    <p>填入兩位選手的資料，準備開打！</p>
    <span class="goal-tag">🎯 第一階段：各自減 10% 體重</span>
  </div>
  <div class="card">
    <div class="card-title">📅 挑戰期間</div>
    <div class="form-group"><label>開始日期</label><input type="date" id="sDate"></div>
    <div class="form-group"><label>預計天數（建議 60–90 天）</label><input type="number" id="sDuration" placeholder="例：90" min="10" max="365"></div>
    <div class="form-group">
      <label>⚖️ 固定量體重時間</label>
      <select id="sWeighTime">
        <option value="早上起床後（空腹）">早上起床後（空腹）🌅 ← 最準確</option>
        <option value="晚上睡前">晚上睡前 🌙</option>
        <option value="早上洗澡後">早上洗澡後 🚿</option>
        <option value="自訂時間">自訂時間</option>
      </select>
    </div>
    <div class="form-group" id="customTimeGroup" style="display:none"><label>自訂時間說明</label><input type="text" id="sCustomTime" placeholder="例：每天飯前"></div>
  </div>
  <div class="card">
    <div class="p-setup s1">
      <h3>🐾 選手一（我）</h3>
      <div class="form-group"><label>名字</label><input type="text" id="sN1" placeholder="你的名字"></div>
      <div class="form-group"><label>起始體重 (kg)</label><input type="number" id="sW1" step="0.1" placeholder="例：58.0"></div>
      <div class="form-group"><label>作戰策略</label><input type="text" id="sSt1" placeholder="只吃原型食物…"></div>
    </div>
    <div style="height:12px"></div>
    <div class="p-setup s2">
      <h3>🐶 選手二（妹妹）</h3>
      <div class="form-group"><label>名字</label><input type="text" id="sN2" placeholder="妹妹的名字"></div>
      <div class="form-group"><label>起始體重 (kg)</label><input type="number" id="sW2" step="0.1" placeholder="例：55.0"></div>
      <div class="form-group"><label>作戰策略</label><input type="text" id="sSt2" placeholder="晚餐不吃澱粉…"></div>
    </div>
    <button class="btn btn-primary" style="margin-top:14px" onclick="saveSetup()">💾 儲存設定，開始挑戰！</button>
  </div>
</div>

<script>
const MS_PCTS = [0.02, 0.04, 0.06, 0.08, 0.10];
const MS_ICONS = ['🐾','🐶','🐱','💪','🏆'];
const MS_SUBS = ['身體已經開始變化，繼續保持！🐾','汪！妳超棒的，三高在退卻！','喵～血壓感謝妳的努力！','快到了！最後衝刺！💪','恭喜！三高風險大幅降低！🎊'];

const QUOTES = [
  ['減輕 10% 體重，三高風險降低 30%。', '每天少一點負擔，身體每天多一點感謝 🐾', '🐱'],
  ['狗狗說：今天也要加油！', '選擇原型食物，就是選擇健康的自己 💚', '🐶'],
  ['健康不是一蹴可幾，是每天一點點的累積。', '記錄今天，就是投資明天 🩺', '🐾'],
  ['貓貓在看著妳，加油不要放棄哦！', '少一口精緻糖，血糖就少一次波動', '🐱'],
  ['最好的投資，是投資在自己的健康上。', '每天進步一點點，加起來就是奇蹟 ✨', '🐶'],
  ['妳們倆都是最棒的！', '健康的身體，才能享受更多美好的事 💕', '🐾'],
  ['不是為了外表，是為了能陪伴家人更久。', '減重是手段，健康才是目的 🌱', '🐱'],
];

let S = {
  p1: { name: '我', startWeight: null, strategy: '只吃原型食物，減少份量' },
  p2: { name: '妹妹', startWeight: null, strategy: '晚餐不吃澱粉＋每天運動一小時' },
  startDate: null, duration: 90, weighTime: '早上起床後（空腹）',
  logs: {}, seenMS: {}
};
let GF = {
  formResponseUrl: 'https://docs.google.com/forms/d/e/1FAIpQLScxHnYU8p6r0sV3Riwu1TISOm3iNf75wnwvotlCYCJr9EhoDw/formResponse',
  entries: ['entry.340905238','entry.383208861','entry.1118776723','entry.1734029234','entry.1956423706','entry.1292053009','entry.1843556797','entry.550920544'],
  csvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTjHtO6R_Z5LOCnrcMdKzbNPfrS7KzOV04SFxYn6iaDCEm_eNa13LAuenY7cgt3doAcrlRlOYu4EpCp/pub?output=csv'
};
let lastSyncTime = null, syncTimer = null;

function getGoal(p) { const sw = p===1?S.p1.startWeight:S.p2.startWeight; return sw ? sw*0.10 : 0; }
function getLoss(p) {
  const sw = p===1?S.p1.startWeight:S.p2.startWeight;
  if (!sw) return 0;
  const keys = Object.keys(S.logs).filter(k=>k.startsWith(`p${p}_`)).sort();
  if (!keys.length) return 0;
  const w = S.logs[keys[keys.length-1]].weight;
  return w ? Math.max(0, sw-w) : 0;
}

function saveLocal() { try { localStorage.setItem('threehigh_v1', JSON.stringify({S})); } catch(e) {} }
function loadLocal() {
  try {
    let r = localStorage.getItem('threehigh_v1') || localStorage.getItem('wdb_v3');
    if (r) { const d=JSON.parse(r); if(d.S){S=d.S; if(!S.duration)S.duration=90; if(!S.seenMS)S.seenMS={};} }
  } catch(e) {}
}

async function submitToForm(player,date,weight,breakfast,lunch,dinner,exercise,note) {
  if (!GF.formResponseUrl||GF.entries.length<8) return;
  const vals=[player,date,String(weight||''),breakfast,lunch,dinner,exercise,note];
  const body=new URLSearchParams();
  GF.entries.forEach((e,i)=>body.append(e,vals[i]||''));
  try { await fetch(GF.formResponseUrl,{method:'POST',mode:'no-cors',body}); } catch(e) {}
}

function parseCSV(text) {
  const rows=[];
  for (const line of text.trim().split('\n')) {
    if(!line.trim())continue;
    const row=[];let cur='',inQ=false;
    for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){row.push(cur.trim());cur='';}else{cur+=c;}}
    row.push(cur.trim());rows.push(row);
  }
  return rows;
}
async function fetchSheetLogs() {
  if (!GF.csvUrl) return;
  setSyncDot('syncing');
  try {
    const r=await fetch(GF.csvUrl+(GF.csvUrl.includes('?')?'&':'?')+'t='+Date.now());
    const text=await r.text();
    const rows=parseCSV(text).slice(1);
    const newLogs={};
    for(const row of rows){
      const [ts,player,date,weight,breakfast,lunch,dinner,exercise,note]=row;
      if(!player||!date)continue;
      const key=`${player}_${date}`;
      if(!newLogs[key]||ts>newLogs[key]._ts){newLogs[key]={weight:parseFloat(weight)||null,breakfast:breakfast||'',lunch:lunch||'',dinner:dinner||'',exercise:exercise||'',note:note||'',_ts:ts};}
    }
    S.logs=newLogs; saveLocal(); lastSyncTime=new Date(); setSyncDot('ok'); updateSyncBar();
  } catch(e){setSyncDot('error');updateSyncBar();}
}

function setSyncDot(s){const d=document.getElementById('syncDot');if(!d)return;d.className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');}
function updateSyncBar(){const l=document.getElementById('syncLabel');if(!l)return;l.textContent=lastSyncTime?`上次同步：${lastSyncTime.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}`:'同步中…';}
async function manualSync(){await fetchSheetLogs();renderDB();toast('✅ 同步完成！');}
function startAutoSync(){
  if(syncTimer)clearInterval(syncTimer);
  if(!GF.csvUrl)return;
  syncTimer=setInterval(async()=>{await fetchSheetLogs();if(document.querySelector('.screen.active')?.id==='screen-dashboard')renderDB();},60000);
}

function go(tab){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  ['dashboard','log','history','setup'].forEach((t,i)=>{if(t===tab)document.querySelectorAll('.tab')[i].classList.add('active');});
  if(tab==='dashboard')renderDB();
  if(tab==='log')initLog();
  if(tab==='history')renderHist();
  if(tab==='setup')initSetup();
}

function renderDB(){
  const el=document.getElementById('db');
  if(!S.startDate||!S.p1.startWeight||!S.p2.startWeight){
    el.innerHTML=`<div class="empty"><span class="empty-icon">🩺</span><p style="font-weight:800;font-size:1rem">先去設定頁完成設定</p><p style="margin-top:6px;font-size:0.85rem">輸入名字、起始體重和挑戰日期</p><button class="btn btn-primary" style="margin-top:16px" onclick="go('setup')">去設定 →</button></div>`;

  const dLeft=Math.max(0,Math.ceil((end-today)/86400000));
  const loss1=getLoss(1),loss2=getLoss(2);
  const goal1=getGoal(1),goal2=getGoal(2);
  const pct1=goal1?Math.min(100,(loss1/goal1)*100):0;
  const pct2=goal2?Math.min(100,(loss2/goal2)*100):0;

  const lossPct2=S.p2.startWeight?(loss2/S.p2.startWeight*100):0;
  const lead=loss1>loss2?S.p1.name:loss2>loss1?S.p2.name:null;

  const startDot=Math.max(1,dayN-showDays+1);
  let dots='';
  for(let d=startDot;d<=Math.min(dur,startDot+showDays-1);d++){
    const ds=dateStr(d),k1=`p1_${ds}`,k2=`p2_${ds}`;
    const h1=!!S.logs[k1],h2=!!S.logs[k2];
    const cls=h1&&h2?'logged-both':h1||h2?'logged-one':'';
    dots+=`<div class="dd ${cls} ${d===dayN?'today':''}" title="第${d}天">${d}</div>`;
  }
  el.innerHTML=`
    <div class="sync-bar">
      <div class="sync-status"><div class="sync-dot" id="syncDot"></div><span id="syncLabel">上次同步：${syncTime}</span></div>
      <button class="sync-btn" onclick="manualSync()">↻ 同步</button>
    </div>
    <div class="quote-box">
      <div class="quote-text">${q[0]}</div>
      <div class="quote-sub">${q[1]}</div>
      <div class="quote-pet">${q[2]}</div>
    </div>
    <div class="battle-banner">
      <div class="fighter p1">
        <div class="fighter-name">🐾 ${S.p1.name}</div>
        <div class="fighter-kg">-${loss1.toFixed(1)}</div>
        <div class="fighter-sub">kg 減少</div>
        <div class="fighter-pct">${lossPct1.toFixed(1)}% / 10%</div>
        ${loss1>=goal1&&goal1>0?'<div style="font-size:0.75rem;font-weight:800;color:var(--teal);margin-top:4px">🏆 達成目標！</div>':''}
      </div>
      <div class="versus-icon">💪</div>
      <div class="fighter p2">
        <div class="fighter-name">🐶 ${S.p2.name}</div>
        <div class="fighter-kg">-${loss2.toFixed(1)}</div>
        <div class="fighter-sub">kg 減少</div>
        <div class="fighter-pct">${lossPct2.toFixed(1)}% / 10%</div>
        ${loss2>=goal2&&goal2>0?'<div style="font-size:0.75rem;font-weight:800;color:var(--p2);margin-top:4px">🏆 達成目標！</div>':''}
      </div>
    </div>
    <div class="card">
      <div class="card-title">🐾 ${S.p1.name} 里程碑</div>
      <div class="milestone-row">${renderMSDots(1,loss1)}</div>
    </div>
    <div class="card">
      <div class="card-title">🐶 ${S.p2.name} 里程碑</div>
      <div class="milestone-row">${renderMSDots(2,loss2)}</div>
    </div>
    <div class="card">
      <div class="card-title">📊 減重進度（目標各自 10% 體重）</div>
      <div class="prog-wrap" style="margin-bottom:14px">
        <div class="prog-label"><span style="color:var(--p1)">🐾 ${S.p1.name}</span><span>${loss1.toFixed(2)} / ${goal1.toFixed(2)} kg</span></div>
        <div class="prog-track"><div class="prog-fill p1" style="width:${pct1}%"></div></div>
      </div>
      <div class="prog-wrap">
        <div class="prog-label"><span style="color:var(--p2)">🐶 ${S.p2.name}</span><span>${loss2.toFixed(2)} / ${goal2.toFixed(2)} kg</span></div>
        <div class="prog-track"><div class="prog-fill p2" style="width:${pct2}%"></div></div>
      </div>
      ${lead?`<div style="text-align:center;margin-top:12px;font-size:0.85rem;font-weight:800;color:var(--teal)">🐾 ${lead} 目前領先！</div>`:`<div style="text-align:center;margin-top:12px;font-size:0.85rem;font-weight:800;color:var(--muted)">🤝 目前並駕齊驅！</div>`}
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="v cg">第${dayN}天</div><div class="l">今天</div></div>
      <div class="stat"><div class="v">${dLeft}</div><div class="l">剩餘天數</div></div>
      <div class="stat c1"><div class="v">${Math.max(0,goal1-loss1).toFixed(1)}</div><div class="l">${S.p1.name} 還差(kg)</div></div>
      <div class="stat c2"><div class="v">${Math.max(0,goal2-loss2).toFixed(1)}</div><div class="l">${S.p2.name} 還差(kg)</div></div>
    </div>
    <div class="card">
      <div class="card-title">📅 打卡記錄（近 ${showDays} 天・🟢兩人 🟡一人）</div>
      <div class="day-row">${dots}</div>
    </div>
    <div class="card">
      <div class="card-title">🥊 作戰策略</div>
      <div style="margin-bottom:8px"><span style="color:var(--p1);font-weight:800">🐾 ${S.p1.name}</span><span style="font-size:0.88rem;color:var(--muted);margin-left:8px">${S.p1.strategy}</span></div>
      <div><span style="color:var(--p2);font-weight:800">🐶 ${S.p2.name}</span><span style="font-size:0.88rem;color:var(--muted);margin-left:8px">${S.p2.strategy}</span></div>
      ${S.weighTime?`<div style="margin-top:10px;font-size:0.8rem;color:var(--teal);font-weight:700">⏰ 量體重時間：${S.weighTime}</div>`:''}
    </div>
    <div class="card" style="border-color:#B8DDD5">
      <div class="card-title">🩺 為什麼要防止三高？</div>
      <div style="font-size:0.82rem;color:var(--muted);line-height:1.7">體重減輕 <b style="color:var(--teal)">5–10%</b>，可以顯著降低：</div>
      <div style="margin-top:8px">
        <span class="info-chip">🫀 高血壓風險 ↓</span>
        <span class="info-chip">🩸 高血糖風險 ↓</span>
        <span class="info-chip">🫀 高血脂風險 ↓</span>
        <span class="info-chip">😴 睡眠品質 ↑</span>
        <span class="info-chip">⚡ 體力精神 ↑</span>
      </div>
    </div>`;
}

function renderMSDots(p,loss){
  const sw=p===1?S.p1.startWeight:S.p2.startWeight;
  if(!sw)return MS_PCTS.map(pct=>`<div class="ms"><span class="ms-icon">○</span>${Math.round(pct*100)}%</div>`).join('');
  return MS_PCTS.map((pct,i)=>{
    const reached=loss>=sw*pct;
    return `<div class="ms ${reached?(p===1?'reached':'p2-reached'):''}"><span class="ms-icon">${reached?MS_ICONS[i]:'○'}</span>${Math.round(pct*100)}%</div>`;
  }).join('');
}
function dateStr(dayN){const d=new Date(S.startDate);d.setDate(d.getDate()+dayN-1);return d.toISOString().split('T')[0];}

let curLP=1;
function setLP(p){curLP=p;document.getElementById('lb1').className='toggle-btn'+(p===1?' on-p1':'');document.getElementById('lb2').className='toggle-btn'+(p===2?' on-p2':'');refreshLog();}
function initLog(){
  document.getElementById('lDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('ln1').textContent=S.p1.name;
  document.getElementById('ln2').textContent=S.p2.name;
  document.getElementById('weighReminder').textContent=S.weighTime?`⏰ 固定量體重時間：${S.weighTime}`:'⏰ 記得在固定時間量體重唷！';
  refreshLog();
}
function refreshLog(){
  const date=document.getElementById('lDate').value;
  const dur=S.duration||90;
  if(S.startDate&&date){const d=Math.floor((new Date(date)-new Date(S.startDate))/86400000)+1;document.getElementById('logDayBadge').textContent=(d>=1&&d<=dur)?`📅 第 ${d} 天`:'⚠️ 不在挑戰期間';}
  const e=S.logs[`p${curLP}_${date}`]||{};
  document.getElementById('lWt').value=e.weight||'';
  document.getElementById('lBF').value=e.breakfast||'';
  document.getElementById('lL').value=e.lunch||'';
  document.getElementById('lD').value=e.dinner||'';
  document.getElementById('lEx').value=e.exercise||'';
  document.getElementById('lNote').value=e.note||'';
}
async function saveLog(){
  const date=document.getElementById('lDate').value;
  if(!date){toast('請選擇日期！');return;}
  const weight=parseFloat(document.getElementById('lWt').value)||null;
  const breakfast=document.getElementById('lBF').value,lunch=document.getElementById('lL').value,dinner=document.getElementById('lD').value,exercise=document.getElementById('lEx').value,note=document.getElementById('lNote').value;
  const prevLoss=getLoss(curLP);
  S.logs[`p${curLP}_${date}`]={weight,breakfast,lunch,dinner,exercise,note};
  saveLocal();
  submitToForm(`p${curLP}`,date,weight,breakfast,lunch,dinner,exercise,note);
  const msgs=['已儲存！身體正在慢慢變好 🐾','記錄成功！繼續保持 💪','儲存完成！妳最棒了 🩺','已記錄！三高在退卻中 🐱'];
  toast('✅ '+msgs[Math.floor(Math.random()*msgs.length)]);
  setTimeout(async()=>{await fetchSheetLogs();checkMilestones(curLP,prevLoss,getLoss(curLP));},3000);
}

function checkMilestones(p,prev,next){
  const sw=p===1?S.p1.startWeight:S.p2.startWeight;
  if(!sw)return;
  MS_PCTS.forEach((pct,i)=>{
    const threshold=sw*pct,key=`p${p}_${Math.round(pct*100)}pct`;
    if(next>=threshold&&prev<threshold&&!S.seenMS[key]){
      S.seenMS[key]=true;saveLocal();
      const m={icon:MS_ICONS[i],title:`${MS_ICONS[i]} 減了 ${Math.round(pct*100)}%！`,sub:MS_SUBS[i],confetti:i===4};
      setTimeout(()=>showMS(m),400);
    }
  });
}
function showMS(m){
  const pop=document.getElementById('msPopup');
  document.getElementById('mpIcon').textContent=m.icon;
  document.getElementById('mpTitle').textContent=m.title;
  document.getElementById('mpSub').textContent=m.sub;
  pop.classList.add('show');
  if(m.confetti)confetti();else petalShower();
  setTimeout(()=>pop.classList.remove('show'),4500);
}

let curHP=1;
function setHP(p){curHP=p;document.getElementById('hb1').className='toggle-btn'+(p===1?' on-p1':'');document.getElementById('hb2').className='toggle-btn'+(p===2?' on-p2':'');renderHist();}
function renderHist(){
  document.getElementById('hn1').textContent=S.p1.name;
  document.getElementById('hn2').textContent=S.p2.name;
  const el=document.getElementById('hist');
  const sw=curHP===1?S.p1.startWeight:S.p2.startWeight;
  const keys=Object.keys(S.logs).filter(k=>k.startsWith(`p${curHP}_`)).sort().reverse();
  if(!keys.length){el.innerHTML=`<div class="empty"><span class="empty-icon">🩺</span><p>還沒有記錄！</p></div>`;return;}
  let html='';
  keys.forEach(k=>{
    const log=S.logs[k],ds=k.replace(`p${curHP}_`,'');
    const dn=S.startDate?Math.floor((new Date(ds)-new Date(S.startDate))/86400000)+1:'?';
    const diff=sw&&log.weight?(sw-log.weight):null;
    const diffPct=sw&&log.weight?((sw-log.weight)/sw*100):null;
    html+=`<div class="log-item p${curHP}">
      <div class="log-header">
        <div class="log-day">第${dn}天・${ds}</div>
        ${log.weight?`<div class="log-kg">${log.weight}kg ${diff!==null?`(${diff>0?'-':'+'}${Math.abs(diff).toFixed(2)}kg / ${diffPct!==null?Math.abs(diffPct).toFixed(1)+'%':''})`:''}</div>`:''}
      </div>
      ${log.breakfast?`<div class="log-row">🌅 早餐：<b>${log.breakfast}</b></div>`:''}
      ${log.lunch?`<div class="log-row">☀️ 午餐：<b>${log.lunch}</b></div>`:''}
      ${log.dinner?`<div class="log-row">🌙 晚餐：<b>${log.dinner}</b></div>`:''}
      ${log.exercise?`<div class="log-row">🏃 運動：<b>${log.exercise}</b></div>`:''}
      ${log.note?`<div class="log-row">💬 備註：<b>${log.note}</b></div>`:''}
    </div>`;
  });
  el.innerHTML=html;
}

function initSetup(){
  document.getElementById('sN1').value=S.p1.name!=='我'?S.p1.name:'';
  document.getElementById('sN2').value=S.p2.name!=='妹妹'?S.p2.name:'';
  document.getElementById('sW1').value=S.p1.startWeight||'';
  document.getElementById('sW2').value=S.p2.startWeight||'';
  document.getElementById('sSt1').value=S.p1.strategy;
  document.getElementById('sSt2').value=S.p2.strategy;
  document.getElementById('sDate').value=S.startDate||new Date().toISOString().split('T')[0];
  document.getElementById('sDuration').value=S.duration||90;
  if(S.weighTime)document.getElementById('sWeighTime').value=S.weighTime;
  document.getElementById('sWeighTime').addEventListener('change',function(){document.getElementById('customTimeGroup').style.display=this.value==='自訂時間'?'block':'none';});
}
async function saveSetup(){
  const sd=document.getElementById('sDate').value;
  if(!sd){toast('請選擇開始日期！');return;}
  S.p1.name=document.getElementById('sN1').value.trim()||'我';
  S.p2.name=document.getElementById('sN2').value.trim()||'妹妹';
  S.p1.startWeight=parseFloat(document.getElementById('sW1').value)||null;
  S.p2.startWeight=parseFloat(document.getElementById('sW2').value)||null;
  S.p1.strategy=document.getElementById('sSt1').value||S.p1.strategy;
  S.p2.strategy=document.getElementById('sSt2').value||S.p2.strategy;
  S.startDate=sd;
  S.duration=parseInt(document.getElementById('sDuration').value)||90;
  const wt=document.getElementById('sWeighTime').value;
  S.weighTime=wt==='自訂時間'?document.getElementById('sCustomTime').value:wt;
  saveLocal();startAutoSync();
  if(S.p1.startWeight)toast(`✅ 設定完成！${S.p1.name} 目標：${(S.p1.startWeight*0.1).toFixed(1)}kg 🐾`);
  else toast('✅ 設定完成！挑戰開始！🩺');
  setTimeout(()=>go('dashboard'),1000);
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

function confetti(){
  const wrap=document.getElementById('confettiWrap');
  const colors=['#1A9080','#29A08A','#4A8F5A','#E0F2ED','#4A7FBF','#EAF1FB','#B8DDD5'];
  for(let i=0;i<90;i++){const p=document.createElement('div');p.className='cp';p.style.left=Math.random()*100+'%';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.width=(6+Math.random()*8)+'px';p.style.height=p.style.width;p.style.animationDelay=Math.random()*1.5+'s';p.style.animationDuration=(2.5+Math.random()*2)+'s';p.style.borderRadius=Math.random()>.5?'50%':'3px';wrap.appendChild(p);setTimeout(()=>p.remove(),5000);}
}
function petalShower(){
  const wrap=document.getElementById('confettiWrap');
  const icons=['🐾','🐶','🐱','💪','🌿','✨','🩺'];
  for(let i=0;i<20;i++){const p=document.createElement('div');p.style.cssText=`position:absolute;top:-20px;left:${Math.random()*100}%;font-size:${1+Math.random()}rem;animation:fall ${2+Math.random()*2}s ease-in ${Math.random()*1.2}s forwards;opacity:0`;p.textContent=icons[Math.floor(Math.random()*icons.length)];wrap.appendChild(p);setTimeout(()=>p.remove(),4500);}
}

(async()=>{
  loadLocal();
  if(GF.csvUrl)await fetchSheetLogs();
  startAutoSync();renderDB();
  document.getElementById('lDate').value=new Date().toISOString().split('T')[0];
  ['ln1','hn1'].forEach(id=>document.getElementById(id).textContent=S.p1.name);
  ['ln2','hn2'].forEach(id=>document.getElementById(id).textContent=S.p2.name);
})();
</script>
